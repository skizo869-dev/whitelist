<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dream City - Whitelist Application</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .welcome-text {
            color: #ff0000;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff0000;
            letter-spacing: 2px;
            text-align: center;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-container img {
            max-width: 260px;
            height: auto;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #101010;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #330000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
            box-sizing: border-box;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #ff3333;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        input, textarea {
            width: 100%;
            background-color: #000000;
            border: 1px solid #440000;
            padding: 12px;
            color: #fff;
            border-radius: 5px;
            margin-bottom: 20px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            border-color: #ff0000;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }
        button {
            width: 100%;
            background-color: #990000;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        button:hover {
            background-color: #ff0000;
            box-shadow: 0 0 15px #ff0000;
        }
    </style>
</head>
<body>

    <div class="welcome-text">WELCOME TO DREAM CITY</div>

    <div class="logo-container">
        <img src="https://i.ibb.co/3yzV6bJX/image.png" alt="Dream City Logo">
    </div>

    <div class="container">
        <form action="https://formspree.io/f/xnpavbaj" method="POST">
            
            <label>REAL NAME (IRL)</label>
            <input type="text" name="name_irl" placeholder="Enter your real name" required>

            <label>YOUR AGE</label>
            <input type="number" name="age" placeholder="Enter your age" required>

            <label>CHARACTER NAME (IN-GAME)</label>
            <input type="text" name="name_ingame" placeholder="First and Last name" required>

            <label>DISCORD ID</label>
            <input type="text" name="discord" placeholder="username#0000" required>

            <label>CHARACTER BACKSTORY</label>
            <textarea name="backstory" rows="5" placeholder="Tell us about your character..." required></textarea>

            <button type="submit">SUBMIT APPLICATION</button>
        </form>
    </div>

</body>
</html>
