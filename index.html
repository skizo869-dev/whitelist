<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الوايت ليست</title>
</head>
<body>

    <h2>تقديم طلب وايت ليست للسيرفر</h2>
    
    <form action="https://formspree.io/f/xnpavbaj" method="POST">
        <label>
            البريد الإلكتروني:
            <input type="email" name="email" required>
        </label>
        <br><br>
        <label>
            الرسالة أو سبب الانضمام:
            <textarea name="message" rows="4" required></textarea>
        </label>
        <br><br>
        <button type="submit">إرسال الطلب</button>
    </form>

</body>
</html>
